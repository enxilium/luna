[project]
name = "luna"
version = "0.1.0"
description = "Desktop voice assistant using Gemini Live and Pipecat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3,<4",
    "asyncpg>=0.31,<1",
    "google-auth-oauthlib>=1.2,<2",
    "hindsight-client==1.1.0",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.26,<5",
    "mcp==2.1.1",
    "pipecat-ai[google,mcp]==1.12.0",
    "pyobjc-framework-avfoundation>=12.2.2,<13",
    "pyobjc-framework-corelocation>=12.2.2,<13",
    "pyobjc-framework-eventkit>=12.2.2,<13",
    "pyobjc-framework-security>=12.2.2,<13",
    "pyobjc-framework-webkit>=12.2.2,<13",
    "pypdf>=6,<7",
    "python-dotenv>=1.2.3,<2",
    "sherpa-onnx==2.0.1",
]
